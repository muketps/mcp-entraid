[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-entraid"
version = "0.1.0"
description = "MCP corporativo para Microsoft Entra ID usando FastMCP e Microsoft Graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_entraid"]
